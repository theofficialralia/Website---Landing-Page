/* ===========================================================================

   RENDER BLOG CARDS

   =========================================================================== */

function renderBlogCards(){

  const container =

    document.getElementById("blog-grid-container");

  if(!container){

    return;

  }

  container.innerHTML = "";

  blogPosts.forEach(function(post){

    const card = document.createElement("article");

    card.className = "blog-card";

    card.onclick = function(){

      openArticle(post.id);

    };

    card.innerHTML = `

      <img

        class="card-img"

        src="${post.image}"

        alt="${post.title}"

      >

      <div class="card-body">

        <div class="card-meta">

          <span class="author-tag">

            ${post.author}

          </span>

          <span>

            ${post.date}

          </span>

        </div>

        <h2 class="card-title">

          ${post.title}

        </h2>

        <p class="card-excerpt">

          ${post.excerpt}

        </p>

        <span class="read-more-link">

          Read article

          <span>→</span>

        </span>

      </div>

    `;

    container.appendChild(card);

  });

}

/* ===========================================================================

   OPEN ARTICLE

   =========================================================================== */

function openArticle(id){

  const post =

    blogPosts.find(function(item){

      return item.id === id;

    });

  if(!post){

    return;

  }

  document.getElementById("blog-home-view").style.display = "none";

  document.getElementById("article-view").style.display = "block";

  document.getElementById("art-title").textContent =

    post.title;

  document.getElementById("art-author").textContent =

    post.author;

  document.getElementById("art-date").textContent =

    post.date;

  document.getElementById("art-image").src =

    post.image;

  document.getElementById("art-image").alt =

    post.title;

  document.getElementById("art-content").innerHTML =

    post.content;

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}

/* ===========================================================================

   RETURN TO BLOG HOME

   =========================================================================== */

function showBlogHome(){

  document.getElementById("article-view").style.display = "none";

  document.getElementById("blog-home-view").style.display = "block";

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}

/* ===========================================================================

   INITIALISE

   =========================================================================== */

document.addEventListener("DOMContentLoaded", function(){

  renderBlogCards();

});
